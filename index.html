<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="La Huella">
<title>La Huella de Bibi & Tris</title><link rel="icon" href="icono.ico"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#5e1a22">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--gr:#5e1a22;--gr2:#7a2430;--oc:#c8892b;--na:#e0922f;--pa:#f6e2b8;--ti:#3b1d14;--f:'Alegreya','Palatino Linotype','Book Antiqua',Georgia,serif}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--f);color:var(--ti);background:radial-gradient(ellipse at 50% 35%,#ebb25c,#cb8c36 62%,#a96b23) fixed;min-height:100vh}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 14px;background:linear-gradient(#6c2029,#4a1219);border-bottom:3px solid var(--na);color:var(--pa)}

button{font:inherit;font-weight:600;cursor:pointer;border:1px solid #3b0f14;background:var(--gr2);color:var(--pa);border-radius:7px;padding:5px 13px;transition:.15s}

@media(min-width:1101px){.wrap{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch;padding:10px 10px 16px}}
.wrap{padding:10px 8px 16px}
.lado{display:flex;flex-direction:column;justify-content:space-between;align-items:center;gap:16px;min-width:0}
.btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:180px}.btns button{width:100%;padding:9px 6px}
.btns .suave{background:transparent;color:var(--gr);border:1.5px solid var(--gr2)}.btns .suave:hover{background:var(--gr);color:var(--pa)}
.deco{display:block;border:6px solid #fbf4e2;border-radius:4px;box-shadow:0 6px 14px #0007;transform:rotate(var(--r,0deg))}
.d1{width:72%;--r:-2.5deg}.d2{width:66%;--r:3deg;margin-right:7%;align-self:flex-end}.d3{width:58.5%;--r:2deg;margin-left:9%;align-self:flex-start}.d4{width:55.5%;--r:-2deg;margin-left:12%}
.cuad{position:relative;width:min(calc(100vw - 430px),calc((100vh - 76px)*1.4735));aspect-ratio:1522/1033;container-type:inline-size;background:url(cuaderno.jpg) center/100% 100%;filter:drop-shadow(0 10px 22px #0008)}
.pag{position:absolute;top:8.6%;height:82.5%;font-size:1.3cqw;line-height:1.25;display:flex;flex-direction:column;gap:1.4cqw}
#pL{left:6%;width:39.2%}#pR{left:55.6%;width:36.4%}
.tab{position:absolute;left:94.15%;width:5%;height:6.4%;border:0;border-radius:.7cqw;background:transparent;color:var(--gr);font:700 2.3cqw var(--f);padding:0}
.tab:hover:not(:disabled){background:#7a243055;color:var(--gr)}.tab.on{background:var(--gr);color:var(--pa);box-shadow:inset 0 0 0 .2cqw var(--na)}.tab:disabled{cursor:default}
.tab::after{content:attr(data-n);position:absolute;right:112%;top:50%;transform:translateY(-50%);background:var(--gr);color:var(--pa);font:600 1.5cqw var(--f);padding:.4cqw 1cqw;border-radius:.6cqw;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s;z-index:20;border:1px solid var(--na)}
.tab:hover:not(:disabled)::after{opacity:1}
.comp{position:absolute;left:94.3%;top:89.5%;width:4.6%;height:7.6%;background:transparent;border:0;border-radius:50%;padding:0}.comp:hover{background:#7a243044}
h3{font:700 2.1cqw var(--f);color:var(--gr);margin:0 0 .7cqw;border-bottom:1.5px solid var(--oc);padding-bottom:.2cqw}
label{display:block;font-size:1.15cqw;font-weight:600;color:#6b2a1c;margin:0 0 .25cqw}
input,textarea,select{font:inherit;font-size:1.3cqw;color:var(--ti);background:#fff7e0c0;border:1.5px solid var(--gr2);border-radius:8px;padding:.4cqw .7cqw;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--na);outline-offset:0}
textarea{resize:none;line-height:1.3;border-radius:10px}
input[type=date]{text-align:center;padding:.4cqw .3cqw}
input[type=date]::-webkit-datetime-edit{text-align:center}input[type=date]::-webkit-date-and-time-value{text-align:center}
input[type=number]{text-align:center;-moz-appearance:textfield}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=checkbox]{width:1.6cqw;height:1.6cqw;accent-color:var(--gr2);padding:0}
.f{display:flex;gap:1cqw;align-items:end}.c{display:flex;flex-direction:column}
.w10{width:11.5cqw;flex:none}.w7{width:7.5cqw;flex:none}.w6{width:7cqw;flex:none}.g1{flex:1;min-width:0}
.foto{width:15cqw;height:20.5cqw;flex:none;border:.5cqw double var(--gr2);border-radius:4px;background:#ecd199 center/cover;display:flex;align-items:center;justify-content:center;text-align:center;font-style:italic;color:#8a4a2b;cursor:pointer;padding:1cqw;box-shadow:.3cqw .3cqw 0 #6b3d1a44}
.chk{display:flex;gap:2cqw;align-items:center}.chk label{display:flex;gap:.5cqw;align-items:center;margin:0;font-size:1.4cqw;font-weight:500;color:var(--ti)}
.circ{width:4.8cqw;height:4.8cqw;border-radius:50%;background:var(--gr2);color:var(--pa);border:.25cqw double var(--na);display:flex;align-items:center;justify-content:center;font:700 2.4cqw var(--f);box-shadow:.2cqw .3cqw .5cqw #0005;flex:none}
.ult{background:#f3d9a066;border:1.5px dashed var(--gr2);border-radius:9px;padding:.7cqw 1cqw;margin-top:.8cqw;min-height:4.4cqw}
.ult b{color:var(--gr);font-size:1.45cqw}.mut{font-style:italic;color:#8a4a2b}.mano{color:var(--gr)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:2.2cqw 1cqw;justify-items:center;align-content:start}
.pol{width:11cqw;background:#fbf4e2;padding:.7cqw .7cqw .5cqw;box-shadow:.2cqw .4cqw .8cqw #0006;transform:rotate(var(--r));cursor:pointer;transition:.15s}
.pol:hover{transform:rotate(0) scale(1.06);z-index:2}
.pol .im{height:10cqw;background:#d9b676 center/cover;display:flex;align-items:center;justify-content:center;font-size:3cqw;border:1px solid #b98a4a}
.pol .cap{display:flex;align-items:center;gap:.5cqw;justify-content:center;padding-top:.5cqw;font-weight:600;font-size:1.35cqw;color:var(--gr);min-height:3cqw}
.pol .num{background:var(--gr2);color:var(--pa);border-radius:50%;width:2cqw;height:2cqw;display:inline-flex;align-items:center;justify-content:center;font-size:1.2cqw}
.vel{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:30}
.hoja{background:linear-gradient(#f9e6bd,#efd29a);border:3px double var(--gr2);border-radius:12px;width:min(780px,94vw);max-height:90vh;overflow:auto;padding:18px 24px;font-size:17px;position:relative}
.hoja h2{font:700 28px var(--f);color:var(--gr);margin:0 0 10px}.hoja .cerrar{position:absolute;right:12px;top:10px}
.hoja input,.hoja select{font-size:16px;padding:5px 8px}.hoja label{font-size:15px}.hoja h3{font-size:22px;margin-top:14px}
.hoja .f{flex-wrap:wrap}.hoja .f>div{flex:1;min-width:100px}
table{width:100%;border-collapse:collapse}th{font-weight:600;color:#7b2a1c;text-align:left;border-bottom:1.5px solid var(--gr2);padding:3px}td{padding:4px 3px;border-bottom:1px dotted var(--oc)}td.r,th.r{text-align:right}
.x{background:none!important;border:0!important;color:#a33!important;padding:0 4px}
.sel button{background:var(--na);color:var(--gr)}.sel button.on{background:var(--gr2);color:var(--pa)}
@media(max-width:1100px){.deco,#ladoD{display:none}.wrap{display:block}.lado{flex-direction:row;justify-content:center;padding:0 0 8px}.btns{flex-direction:row;max-width:none}.btns button{width:auto;padding:6px 14px}.cuad{width:98vw;margin:0 auto}}
@media print{header,.lado{display:none}}
#syncEst{font-size:13px;font-weight:600;color:var(--pa)}
.btnlink{display:inline-block;background:var(--gr2);color:var(--pa);text-decoration:none;font-weight:600;border-radius:7px;padding:6px 14px;border:1px solid #3b0f14}.btnlink:hover{background:var(--na);color:var(--gr)}
.hoja .err{color:#a33;font-weight:600}.hoja ol{padding-left:22px;line-height:1.5}.hoja .ok{color:#2f6b2f;font-weight:700}
.hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1.5px solid var(--oc);margin-bottom:.8cqw}.hd h3{border:0;margin:0;padding-bottom:.2cqw}.hd button{margin-bottom:.3cqw}
.mini{position:absolute;left:50%;bottom:.5cqw;transform:translateX(-50%);font-size:1.05cqw;padding:.2cqw .7cqw;white-space:nowrap}.foto{position:relative}
.pw{white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#pR{gap:.8cqw}#pR .ult{margin-top:.5cqw;padding:.5cqw .9cqw;min-height:3.4cqw}#pR label{margin-bottom:.15cqw}
input:not([type=checkbox]):not([type=file]),select{height:2.9cqw;min-height:30px}
.hoja input:not([type=checkbox]),.hoja select{height:auto;min-height:0}
input[type=date]{display:block;min-width:0}input[type=date]::-webkit-date-and-time-value{text-align:center;min-height:1.2em}
@media(pointer:coarse){input[type=date]{-webkit-appearance:none;appearance:none}}
#giro{display:none}
@media(orientation:portrait) and (max-width:820px){#giro{display:block;text-align:center;background:var(--na);color:var(--gr);padding:6px;font-weight:600}}
@media(pointer:coarse){input,textarea,select{font-size:max(1.3cqw,16px)}.hoja input,.hoja select{font-size:16px}}
</style></head><body>
<header><img src="logo.png" alt=""><h1>La Huella de Bibi &amp; Tris</h1>
<span class="sp"></span><span id="syncEst"></span><span id="estado"></span>
<button id="bDest" style="display:none"></button><button id="bSync" title="Sincronizar con Dropbox">☁ Dropbox</button><button id="bCar">Carpeta del proyecto</button><button id="bExp">Exportar</button><button id="bImp">Importar</button><button id="bBak">Backup</button><button id="bRes">Restaurar</button>
<input type="file" id="fArc" hidden></header><div id="giro">↻ Gira el dispositivo en horizontal para ver el cuaderno completo.</div>
<div class="wrap"><aside class="lado" id="ladoI"><img class="deco d1" src="recursos/abrazo.webp" alt="Asia, Hada, Irina, Bibi y Tris"><div class="btns"><button id="bAdd">+ Añadir peludo</button><button id="bDel" class="suave">Eliminar peludo</button></div><img class="deco d3" src="recursos/bibi.webp" alt="Bibi"></aside><div class="cuad" id="cuad"><div class="pag" id="pL"></div><div class="pag" id="pR"></div><div id="tabs"></div><button class="comp" id="bComp" title="Índice de peludos"></button></div><aside class="lado" id="ladoD"><img class="deco d2" src="recursos/corazon.webp" alt="Mis cinco estrellas"><img class="deco d4" src="recursos/tris.webp" alt="Tris"></aside></div>
<div id="modal"></div><input type="file" id="fFoto" accept="image/*" hidden>
<script src="sync.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=n=>(+n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'}),fec=d=>d?d.split('-').reverse().join('/'):'',hoy=()=>new Date().toISOString().slice(0,10),nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const nueva=n=>({id:nid(),nombre:n||'',nac:'',alias:'',fotoOrig:'',perro:false,gato:false,macho:false,hembra:false,foto:'',caracter:'',gustos:'',alergias:'',visitas:[],proxima:'',conf:false,pesos:[]});
let vista='pet',gp=0;
const MOVIL=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/i.test(navigator.platform)),WEB_MODE=MOVIL||!window.showDirectoryPicker;
let S={pets:[nueva('Bibi'),nueva('Tris')],pienso:[],gastos:[]},cur=0,root=null,dirs={};
const P=()=>S.pets[cur];
function migrar(){if(!Array.isArray(S.pets))S.pets=Object.values(S.pets||{}).map(p=>({...nueva(),...p,id:nid()}));S.pets=S.pets.map(p=>({...nueva(),...p}));S.pienso??=[];S.gastos??=[];if(!S.pets.length)S.pets=[nueva('')];cur=Math.min(cur,S.pets.length-1)}
/* ---- almacenamiento ---- */
const idb=()=>new Promise((o,k)=>{const r=indexedDB.open('huella',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>o(r.result);r.onerror=k});
const iget=async k=>{try{const d=await idb();return await new Promise(o=>{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>o(q.result);q.onerror=()=>o(null)})}catch{return null}};
const iset=async(k,v)=>{try{(await idb()).transaction('k','readwrite').objectStore('k').put(v,k)}catch{}};
const estado=t=>$('#estado').textContent=t;let tm;
function guardar(){Sync.stamp(S);iset('datos',JSON.stringify(S));Sync.schedule();clearTimeout(tm);tm=setTimeout(async()=>{if(!dirs.DATOS)return;try{const w=await(await dirs.DATOS.getFileHandle('datos.json',{create:true})).createWritable();await w.write(JSON.stringify(S,null,1));await w.close();estado('Guardado en DATOS ✓')}catch{estado('No se pudo guardar en la carpeta. Vuelve a elegirla.')}},300)}
async function prepararCarpetas(h){root=h;for(const n of['DATOS','ILUSTRACION','EXPORTACION','BACKUP'])dirs[n]=await h.getDirectoryHandle(n,{create:true});estado('Proyecto: '+h.name)}
async function leerDatos(){try{const t=await(await(await dirs.DATOS.getFileHandle('datos.json')).getFile()).text();S=JSON.parse(t);migrar();Sync.ensureStamps(S);Sync.reset(S);return true}catch{return false}}
$('#bCar').onclick=async()=>{if(!window.showDirectoryPicker)return alert('Abre este archivo con Microsoft Edge o Chrome para guardar en una carpeta.');
  try{const h=await showDirectoryPicker({mode:'readwrite',id:'huella'});await prepararCarpetas(h);await iset('root',h);
  if(await leerDatos()){render()}else guardar();$('#bCar').textContent='Carpeta del proyecto'}catch{}};
async function iniciar(){if(WEB_MODE)$('#bCar').style.display='none';try{const d=await iget('datos');if(d)S=JSON.parse(d);else{const l=localStorage.getItem('huella');if(l)S=JSON.parse(l)}}catch{}migrar();Sync.ensureStamps(S);Sync.reset(S);
  const h=WEB_MODE?null:await iget('root');
  if(h){try{if(await h.queryPermission({mode:'readwrite'})==='granted'){await prepararCarpetas(h);await leerDatos()}else{estado('Pulsa para reconectar la carpeta');$('#bCar').textContent='Reconectar carpeta';$('#bCar').onclick=async()=>{if(await h.requestPermission({mode:'readwrite'})==='granted'){await prepararCarpetas(h);await leerDatos();render();$('#bCar').textContent='Carpeta del proyecto'}}}}catch{}}
  else estado(WEB_MODE?'Datos guardados en este dispositivo.':'Datos en este navegador. Elige la carpeta del proyecto.');render();await Sync.init(host)}
/* selectores de archivo: abren en su carpeta, pero se puede navegar a otra */
const JSONT=[{description:'Copia JSON',accept:{'application/json':['.json']}}],IMGT=[{description:'Imágenes',accept:{'image/*':['.png','.jpg','.jpeg','.webp','.gif']}}];
async function abrirArchivo(sub,types,fb){try{if(window.showOpenFilePicker){const o={types};if(dirs[sub])o.startIn=dirs[sub];const[h]=await showOpenFilePicker(o);return await h.getFile()}}catch{return null}
  return new Promise(ok=>{const i=$('#fArc');i.accept=fb;i.onchange=()=>ok(i.files[0]||null);i.value='';i.click()})}
async function guardarArchivo(sub,nombre,texto){try{if(window.showSaveFilePicker){const o={suggestedName:nombre,types:JSONT};if(dirs[sub])o.startIn=dirs[sub];const h=await showSaveFilePicker(o);const w=await h.createWritable();await w.write(texto);await w.close();estado('Guardado ✓');return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([texto]));a.download=nombre;a.click()}
const cargarJSON=async sub=>{const f=await abrirArchivo(sub,JSONT,'.json');if(!f)return;try{const d=JSON.parse(await f.text());if(!confirm('Se sustituirán los datos actuales por los del archivo. ¿Continuar?'))return;S=d;migrar();Sync.ensureStamps(S);guardar();render()}catch{alert('El archivo no es una copia válida.')}};
let destino=localStorage.getItem('huellaDestino')||'dbx';
const enDbx=()=>destino==='dbx'&&Sync.status().connected;
function pintarDestino(){const b=$('#bDest'),c=Sync.status().connected;b.style.display=c?'':'none';b.textContent=destino==='dbx'?'Guardar en: ☁ Dropbox':'Guardar en: 💾 Este dispositivo';b.title='Cambia dónde se guardan Exportar y Backup y desde dónde se importan'}
async function enviar(carpeta,nombre){const txt=JSON.stringify(S,null,1);
  if(enDbx()){try{await Sync.upload('/'+carpeta+'/Huella/'+nombre,new Blob([txt]));estado('Guardado en Dropbox: '+carpeta+'/Huella ✓');return}catch(er){alert('No se pudo guardar en Dropbox ('+er.message+'). Se guardará en este dispositivo.')}}
  await guardarArchivo(carpeta,nombre,txt)}
function aplicar(d){if(!d||!Array.isArray(d.pets))return alert('El archivo no es una copia válida de La Huella.');if(!confirm('Se sustituirán los datos actuales por los del archivo. ¿Continuar?'))return;S=d;migrar();Sync.ensureStamps(S);guardar();render()}
async function elegirDbx(carpeta){ven('<h2>'+(carpeta==='BACKUP'?'Restaurar copia de seguridad':'Importar')+'</h2><p class="mut">Archivos en Dropbox · '+carpeta+'/Huella</p><div id="dbxLista"><p class="mut">Cargando…</p></div>');
  try{let a=await Sync.list('/'+carpeta+'/Huella');if(carpeta==='BACKUP')a=a.concat((await Sync.list('/BACKUP')).filter(x=>/^BK_Huella/i.test(x.name)));
    a=a.filter((x,i)=>a.findIndex(y=>y.path_display===x.path_display)===i).sort((x,y)=>y.server_modified.localeCompare(x.server_modified));
    $('#dbxLista').innerHTML=a.length?`<table>${a.map(x=>`<tr><td>${esc(x.name)}</td><td class="r">${new Date(x.server_modified).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}</td><td class="r"><button data-dbxp="${esc(x.path_display)}">Cargar</button></td></tr>`).join('')}</table>`:'<p class="mut">No hay archivos en esta carpeta de Dropbox. Pulsa «Guardar en» para usar este dispositivo.</p>'}
  catch(er){$('#dbxLista').innerHTML='<p class="err">'+esc(er.message)+'</p>'}}
$('#bExp').onclick=()=>enviar('EXPORTACION','Huella-exportacion_'+hoy()+'.json');
$('#bBak').onclick=()=>enviar('BACKUP','BK_Huella-de-Bibi-y-Tris_'+hoy()+'.json');
$('#bImp').onclick=()=>enDbx()?elegirDbx('EXPORTACION'):cargarJSON('EXPORTACION');
$('#bRes').onclick=()=>enDbx()?elegirDbx('BACKUP'):cargarJSON('BACKUP');
/* ---- páginas ---- */
const ult=a=>a.reduce((b,x)=>!b||x.f>=b.f?x:b,null);
function render(){
  const p=P(),g=Math.floor(cur/12);
  $('#tabs').innerHTML=Array.from({length:12},(_,j)=>{const i=g*12+j,q=S.pets[i];return`<button class="tab ${vista==='pet'&&i===cur?'on':''}" style="top:${(70+j*73.4-33)/10.33}%" data-t="${i}" ${q?'':'disabled'} data-n="${esc(q?.nombre||'Peludo '+(i+1))}">${q?i+1:''}</button>`}).join('');
  if(vista==='gal')return galeria();
  $('#pL').innerHTML=`<div class="f" style="align-items:start"><div class="foto" id="foto" style="${p.foto?`background-image:url(${p.foto});padding:0`:''}">${p.foto?'':'Toca para añadir su foto'}${p.fotoOrig&&Sync.status().connected?'<button class="mini" id="verOrig">Ver original</button>':''}</div>
  <div class="c" style="gap:1cqw;width:23cqw"><div class="f"><div style="width:10.5cqw;flex:none"><label>Nombre</label><input data-k="nombre" value="${esc(p.nombre)}"></div><div class="w10"><label>Fecha de nacimiento</label><input type="date" data-k="nac" value="${p.nac}"></div></div>
  <div><label>Alias</label><input data-k="alias" value="${esc(p.alias)}"></div>
  <div class="f" style="align-items:center;justify-content:space-between"><div class="c" style="gap:.8cqw"><div class="chk"><label><input type="checkbox" data-k="perro" ${p.perro?'checked':''}>Perro</label><label><input type="checkbox" data-k="gato" ${p.gato?'checked':''}>Gato</label></div><div class="chk"><label><input type="checkbox" data-k="macho" ${p.macho?'checked':''}>Macho</label><label><input type="checkbox" data-k="hembra" ${p.hembra?'checked':''}>Hembra</label></div></div><div class="circ" title="Nº de ${esc(p.nombre)}">${cur+1}</div></div></div></div>
  <div class="f" style="align-items:stretch"><div class="g1"><label>Carácter</label><textarea data-k="caracter" style="height:11.5cqw">${esc(p.caracter)}</textarea></div><div class="g1"><label>Lo que más le gusta</label><textarea data-k="gustos" style="height:11.5cqw">${esc(p.gustos)}</textarea></div></div>
  <div><label>Alergias</label><textarea data-k="alergias" style="height:8cqw">${esc(p.alergias)}</textarea></div>
  <div class="f" style="justify-content:center;margin-top:auto"><button id="bGuardar">Guardar ficha</button></div>`;
  const v=ult(p.visitas),w=ult(p.pesos);
  $('#pR').innerHTML=`<div><div class="hd"><h3>Visitas al veterinario</h3><button id="addV">Añadir visita</button></div>
  <div class="f"><div class="w10"><label>Fecha</label><input type="date" id="vf" value="${hoy()}"></div><div class="w6"><label>Coste €</label><input type="number" step="0.01" min="0" id="vc"></div></div>
  <div style="margin-top:.7cqw"><label>Motivo</label><textarea id="vm" style="height:4cqw"></textarea></div>
  <div style="margin-top:.7cqw"><label>Notas</label><input id="vn"></div>
  <div class="ult">${v?`<b>Última visita · ${fec(v.f)}</b> ${v.c?'· '+eur(v.c):''}<br><span class="pw">${esc(v.m)}</span>${v.n?` <span class="mano">— ${esc(v.n)}</span>`:''}`:'<span class="mut">Todavía no hay visitas registradas.</span>'}</div>
  <div class="f" style="margin-top:.8cqw"><div class="w10"><label>Próxima visita</label><input type="date" data-k="proxima" value="${p.proxima}"></div><div class="chk" style="padding-bottom:.5cqw"><label><input type="checkbox" data-k="conf" ${p.conf?'checked':''}>Cita confirmada</label></div></div></div>
  <div><div class="hd"><h3>Peso</h3><button id="addP">Añadir peso</button></div>
  <div class="f"><div class="w10"><label>Fecha</label><input type="date" id="pf" value="${hoy()}"></div><div class="w7"><label>Peso (kg)</label><input type="number" step="0.01" min="0" id="pk"></div></div>
  <div style="margin-top:.7cqw"><label>Notas</label><input id="pn"></div>
  <div class="ult">${w?`<b>Último peso · ${fec(w.f)}</b> &nbsp; ${String(w.kg).replace('.',',')} kg${w.n?` <span class="mano">— ${esc(w.n)}</span>`:''}`:'<span class="mut">Todavía no hay pesos anotados.</span>'}</div></div>
  <div class="f" style="justify-content:center;margin-top:auto;gap:1.6cqw"><button id="bAnt2">Datos anteriores</button><button id="bGas2">Gastos</button></div>`;
  document.title=(p.nombre||'Peludo')+' · La Huella de Bibi & Tris';
}
function galeria(){const n=Math.max(1,Math.ceil(S.pets.length/12));gp=Math.min(gp,n-1);const sl=S.pets.slice(gp*12,gp*12+12);
  const pol=(q,k)=>{const i=gp*12+k;return`<div class="pol" data-g="${i}" style="--r:${[-2,1.5,-1,2.2][k%4]}deg"><div class="im" style="${q.foto?`background-image:url(${q.foto})`:''}">${q.foto?'':'🐾'}</div><div class="cap"><span class="num">${i+1}</span>${esc(q.nombre)}</div></div>`};
  $('#pL').innerHTML=`<h3 style="text-align:center">Mis peludos</h3><div class="gal">${sl.slice(0,6).map((q,k)=>pol(q,k)).join('')}</div>`;
  $('#pR').innerHTML=`<h3 style="visibility:hidden">.</h3><div class="gal">${sl.slice(6).map((q,k)=>pol(q,k+6)).join('')}</div>${n>1?`<div class="f" style="justify-content:center;margin-top:auto;align-items:center"><button data-gp="-1">‹</button><span>${gp+1} / ${n}</span><button data-gp="1">›</button></div>`:''}`}
document.addEventListener('change',e=>{const k=e.target.dataset.k;if(!k)return;const t=e.target,p=P();p[k]=t.type==='checkbox'?t.checked:t.value;
  const ex={perro:'gato',gato:'perro',macho:'hembra',hembra:'macho'};if(ex[k]&&t.checked){p[ex[k]]=false;render()}
  guardar();if(k==='nombre')render()});
let tI;document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(!k||t.type==='checkbox'||t.type==='date')return;P()[k]=t.value;clearTimeout(tI);tI=setTimeout(guardar,800)});
const val=id=>$('#'+id)?.value.trim();
document.addEventListener('click',async e=>{const t=e.target,id=t.id,D=t.closest('[data-del]');
  if(t.dataset.t!=null&&t.dataset.t!==''){cur=+t.dataset.t;vista='pet';render();return}
  const G=t.closest('[data-g]');if(G){cur=+G.dataset.g;vista='pet';render();return}
  if(t.dataset.gp){gp=Math.max(0,gp+ +t.dataset.gp);render();return}
  if(id==='foto')pedirFoto();
  if(id==='addV'){if(!val('vf')||!val('vm'))return alert('Indica fecha y motivo.');P().visitas.push({id:nid(),f:val('vf'),m:val('vm'),n:val('vn'),c:+val('vc')||0});guardar();render()}
  if(id==='addP'){if(!val('pf')||!val('pk'))return alert('Indica fecha y peso.');P().pesos.push({id:nid(),f:val('pf'),kg:+val('pk'),n:val('pn')});guardar();render()}
  if(id==='bAdd'){S.pets.push(nueva('Nuevo peludo'));cur=S.pets.length-1;vista='pet';guardar();render()}
  if(id==='bDel'){if(S.pets.length<2)return alert('Debe quedar al menos un peludo en el cuaderno.');if(confirm('¿Eliminar a '+(P().nombre||'este peludo')+' y todos sus datos?\n\nSolo debe usarse si fue un error. Se puede recuperar con una copia de Backup.')){S.pets.splice(cur,1);cur=Math.max(0,cur-1);vista='pet';guardar();render()}}
  if(id==='bAnt'||id==='bAnt2')anteriores('p',cur);
  if(id==='bGas2')gastos();
  if(id==='bGuardar'){guardar();t.textContent='✓ Guardado';setTimeout(()=>{const g=$('#bGuardar');if(g)g.textContent='Guardar ficha'},1800);Sync.syncNow({}).catch(()=>{})}
  if(id==='verOrig'){ven('<h2>Foto original</h2><p class="mut" id="origMsg">Cargando desde Dropbox…</p><div id="origImg"></div>');try{const u=URL.createObjectURL(await Sync.download(P().fotoOrig));$('#origImg').innerHTML='<img src="'+u+'" style="max-width:100%;border-radius:6px">';$('#origMsg').remove()}catch(er){$('#origMsg').textContent='No se pudo abrir el original ahora ('+er.message+'). La miniatura sigue disponible.'}}
  if(t.dataset.dbxp){try{const d=JSON.parse(await(await Sync.download(t.dataset.dbxp)).text());$('#modal').innerHTML='';aplicar(d)}catch(er){alert('No se pudo cargar ese archivo: '+er.message)}}
  if(id==='bDest'){destino=destino==='dbx'?'local':'dbx';localStorage.setItem('huellaDestino',destino);pintarDestino()}
  if(id==='bSync'){ven('<h2>Sincronizar con Dropbox</h2><div id="syncBody"></div>');pintarSync()}
  if(id==='syncConnect'){const c=val('syncCode');if(!c)return alert('Pega primero el código que te muestra Dropbox.');t.disabled=true;t.textContent='Conectando…';try{await Sync.connectWithCode(c);pintarSync();Sync.syncNow({}).catch(()=>{})}catch(er){alert(er.message);t.disabled=false;t.textContent='Conectar'}}
  if(id==='syncNow'){t.disabled=true;try{await Sync.syncNow({})}catch{}pintarSync()}
  if(id==='syncDisc'&&confirm('¿Desconectar Dropbox en ESTE dispositivo?\n\nTus peludos se quedan aquí y en Dropbox; solo se detiene la sincronización de este dispositivo.')){await Sync.disconnect();pintarSync()}
  if(id==='bComp'){vista=vista==='gal'?'pet':'gal';if(vista==='gal')gp=Math.floor(cur/12);render();return}
  if(t.classList.contains('cerrar')||t.classList.contains('vel')&&t===e.target){$('#modal').innerHTML='';render()}
  if(t.dataset.m){anteriores(t.dataset.m,+$('#aq').value)}
  if(D){if(!confirm('¿Borrar este registro?'))return;const[w,i]=D.dataset.del.split(':');const arr=w==='pienso'||w==='gastos'?S[w]:P()[w];arr.splice(arr.findIndex(x=>x.id===i),1);guardar();w==='pienso'||w==='gastos'?gastos():anteriores(w==='pesos'?'p':'v',cur)}
  if(id==='addN'){if(!val('nf')||!val('nm')||!val('np'))return alert('Indica fecha, marca y precio.');S.pienso.push({id:nid(),f:val('nf'),m:val('nm'),q:val('nq'),k:+val('nk')||0,p:+val('np')});guardar();gastos()}
  if(id==='addG'){if(!val('gf')||!val('gc')||!val('gp'))return alert('Indica fecha, concepto e importe.');S.gastos.push({id:nid(),f:val('gf'),m:val('gc'),p:+val('gp')});guardar();gastos()}
});
async function pedirFoto(){const f=await abrirArchivo('ILUSTRACION',IMGT,'image/*');if(!f)return;const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,420/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);P().foto=c.toDataURL('image/jpeg',.78);P().fotoOrig='';guardar();render();subirOriginal(f,P().id)};img.src=URL.createObjectURL(f)}
async function subirOriginal(f,id){if(!Sync.status().connected)return;const p=S.pets.find(x=>x.id===id);if(!p)return;try{const ext=((f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,''))||'jpg',slug=(p.nombre||'peludo').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'_');const r=await Sync.upload('/ILUSTRACIONES/Huella/'+slug+'_'+id.slice(-5)+'.'+ext,f);const q=S.pets.find(x=>x.id===id);if(q){q.fotoOrig=r.path_display;guardar();render()}estado('Foto original guardada en Dropbox ✓')}catch(er){estado('Foto guardada; el original no se pudo subir ahora.')}}
/* ---- ventanas ---- */
const ven=h=>{$('#modal').innerHTML=`<div class="vel"><div class="hoja"><button class="cerrar">Cerrar</button>${h}</div></div>`};
const lis=(a,tipo,fila)=>a.length?`<table>${a.map(x=>`<tr>${fila(x)}<td class="r"><button class="x" data-del="${tipo}:${x.id}" title="Borrar">✕</button></td></tr>`).join('')}</table>`:'<p class="mut">Sin registros.</p>';
function grafica(pes){const a=[...pes].sort((x,y)=>x.f.localeCompare(y.f));if(a.length<2)return'<p class="mut">Con dos o más pesos aparecerá la gráfica.</p>';
  const v=a.map(x=>+x.kg),mn=Math.min(...v),mx=Math.max(...v),r=(mx-mn)||1,X=i=>50+i*(620/(a.length-1)),Y=k=>150-((k-mn)/r)*120;
  return`<svg viewBox="0 0 700 190" style="width:100%"><line x1="50" y1="155" x2="680" y2="155" stroke="#b98a4a"/><polyline fill="none" stroke="#7a2430" stroke-width="2.5" points="${v.map((k,i)=>X(i)+','+Y(k)).join(' ')}"/>${v.map((k,i)=>`<circle cx="${X(i)}" cy="${Y(k)}" r="4" fill="#c8892b" stroke="#5e1a22"/><text x="${X(i)}" y="${Y(k)-9}" font-size="12" text-anchor="middle" fill="#5e1a22">${k}</text>`).join('')}<text x="50" y="176" font-size="12" fill="#6b3a1c">${fec(a[0].f)}</text><text x="680" y="176" font-size="12" text-anchor="end" fill="#6b3a1c">${fec(a[a.length-1].f)}</text></svg>`}
function anteriores(m,i){const p=S.pets[i]||P();cur=S.pets.indexOf(p);
  ven(`<h2>Datos anteriores</h2><div class="f"><div style="max-width:240px"><label>Mascota</label><select id="aq" onchange="anteriores('${m}',+this.value)">${S.pets.map((q,j)=>`<option value="${j}" ${j===cur?'selected':''}>${esc(q.nombre||'Peludo '+(j+1))}</option>`).join('')}</select></div>
  <div class="sel" style="flex:none"><button data-m="p" class="${m==='p'?'on':''}">Peso</button> <button data-m="v" class="${m==='v'?'on':''}">Visitas veterinarias</button></div></div>
  ${m==='p'?grafica(p.pesos)+lis([...p.pesos].reverse().sort((a,b)=>b.f.localeCompare(a.f)),'pesos',x=>`<td>${fec(x.f)}</td><td>${String(x.kg).replace('.',',')} kg</td><td><i>${esc(x.n||'')}</i></td>`):lis([...p.visitas].reverse().sort((a,b)=>b.f.localeCompare(a.f)),'visitas',x=>`<td>${fec(x.f)}</td><td>${esc(x.m)}<br><i>${esc(x.n)}</i></td><td class="r">${x.c?eur(x.c):''}</td>`)}`)}
function gastos(){const r={},add=(f,t,v)=>{if(f&&+v)(r[f.slice(0,7)]??={pienso:0,vet:0,otros:0})[t]+=+v};
  S.pienso.forEach(x=>add(x.f,'pienso',x.p));S.gastos.forEach(x=>add(x.f,'otros',x.p));S.pets.forEach(p=>p.visitas.forEach(x=>add(x.f,'vet',x.c)));
  const ks=Object.keys(r).sort().reverse(),mes=k=>['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][k.slice(5)-1]+' '+k.slice(0,4);
  const srt=a=>[...a].sort((x,y)=>y.f.localeCompare(x.f));
  ven(`<h2>Pienso y gastos</h2><h3 style="margin-top:0">Pienso</h3>
  <div class="f"><div><label>Fecha de compra</label><input type="date" id="nf" value="${hoy()}"></div><div style="flex:2"><label>Marca / tipo</label><input id="nm"></div><div><label>Para</label><select id="nq"><option value="">Todos</option>${S.pets.map(q=>`<option>${esc(q.nombre)}</option>`).join('')}</select></div><div style="max-width:90px"><label>Kg</label><input type="number" step="0.1" id="nk"></div><div style="max-width:100px"><label>Precio €</label><input type="number" step="0.01" id="np"></div><button id="addN">Añadir</button></div>
  ${lis(srt(S.pienso).slice(0,8),'pienso',x=>`<td>${fec(x.f)}</td><td>${esc(x.m)} <i>${esc(x.q||'Todos')}${x.k?' · '+x.k+' kg':''}</i></td><td class="r">${eur(x.p)}</td>`)}
  <h3>Otros gastos</h3><div class="f"><div><label>Fecha</label><input type="date" id="gf" value="${hoy()}"></div><div style="flex:2"><label>Concepto</label><input id="gc"></div><div style="max-width:100px"><label>Importe €</label><input type="number" step="0.01" id="gp"></div><button id="addG">Añadir</button></div>
  ${lis(srt(S.gastos).slice(0,8),'gastos',x=>`<td>${fec(x.f)}</td><td>${esc(x.m)}</td><td class="r">${eur(x.p)}</td>`)}
  <h3>Total por mes</h3>${ks.length?`<table><tr><th>Mes</th><th class="r">Pienso</th><th class="r">Veterinario</th><th class="r">Otros</th><th class="r">Total</th></tr>${ks.map(k=>{const o=r[k];return`<tr><td>${mes(k)}</td><td class="r">${eur(o.pienso)}</td><td class="r">${eur(o.vet)}</td><td class="r">${eur(o.otros)}</td><td class="r"><b>${eur(o.pienso+o.vet+o.otros)}</b></td></tr>`}).join('')}</table>`:'<p class="mut">Cuando anotes gastos verás aquí el total de cada mes.</p>'}`)}
const hora=ts=>ts?new Date(ts).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
async function escribirCarpeta(){if(!dirs.DATOS)return;try{const w=await(await dirs.DATOS.getFileHandle('datos.json',{create:true})).createWritable();await w.write(JSON.stringify(S,null,1));await w.close()}catch{}}
const host={instance:'huella',get:()=>S,stamp:()=>Sync.stamp(S),
  async replace(d){S=d;migrar();Sync.ensureStamps(S);Sync.reset(S);await iset('datos',JSON.stringify(S));await escribirCarpeta();render()},
  async backup(label){const tx=JSON.stringify(S,null,1);if(dirs.BACKUP){const f=await dirs.BACKUP.getFileHandle('BK_'+label+'_'+hoy()+'.json',{create:true});const w=await f.createWritable();await w.write(tx);await w.close()}else await iset('bk:'+label,{t:Date.now(),tx})}};
async function pintarSync(){const b=$('#syncBody');if(!b)return;const st=Sync.status();
  if(!st.connected){const draft=$('#syncCode')?.value||'';let u='';try{u=await Sync.authUrl()}catch{}
    b.innerHTML=`<p>Conecta tu Dropbox para tener a Bibi, Tris y todos los peludos al día en Windows, Android y iPad. La app solo usa su propia carpeta dentro de <b>Apps</b> de tu Dropbox.</p><ol><li>Pulsa <b>Abrir Dropbox</b>, inicia sesión y pulsa <b>Permitir</b>.</li><li>Copia el <b>código</b> que te muestra Dropbox.</li><li>Pégalo aquí y pulsa <b>Conectar</b>.</li></ol>${u?`<p><a class="btnlink" href="${u}" target="_blank" rel="noopener">Abrir Dropbox…</a></p>`:'<p class="err">No se pudo preparar la conexión en este navegador.</p>'}<label>Código de Dropbox</label><input id="syncCode" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Pega aquí el código" value="${esc(draft)}"><div class="f" style="margin-top:12px"><button id="syncConnect">Conectar</button></div>${st.error?`<p class="err">${esc(st.error)}</p>`:''}`}
  else b.innerHTML=`<p class="ok">● Conectado a Dropbox</p><p>Última sincronización: <b>${hora(st.lastSyncAt)}</b>${st.busy?' (sincronizando…)':''}</p>${st.lastResult?`<p class="mut">${esc(st.lastResult)}</p>`:''}${st.error?`<p class="err">${esc(st.error)}</p>`:''}${st.pending&&!st.error?'<p>Hay cambios pendientes: se enviarán cuando haya conexión.</p>':''}<p class="mut">Se sincroniza sola al abrir la app, unos segundos después de cada cambio y al recuperar la conexión. Las copias automáticas (máx. 1 al día) van a la carpeta BACKUP de la app en tu Dropbox.</p><div class="f" style="margin-top:12px;justify-content:space-between"><button id="syncDisc">Desconectar este dispositivo</button><button id="syncNow">Sincronizar ahora</button></div>`}
Sync.onStatus(st=>{pintarDestino();const e=!st.connected?'':st.busy?'☁ Sincronizando…':st.error&&!st.pending?'☁ Error al sincronizar':st.pending?'☁ Pendiente':'☁ Sincronizado '+hora(st.lastSyncAt);$('#syncEst').textContent=e;if($('#syncBody')&&document.activeElement?.id!=='syncCode')pintarSync()});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('Service worker no registrado',e)));
iniciar();
</script></body></html>
