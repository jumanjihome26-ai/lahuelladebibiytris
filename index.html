  if(t.classList.contains('cerrar')||t.classList.contains('vel')&&t===e.target){$('#modal').innerHTML='';render()}
  if(t.dataset.m){anteriores(t.dataset.m,+$('#aq').value)}
  if(D){if(!confirm('¿Borrar este registro?'))return;const[w,i]=D.dataset.del.split(':');const arr=w==='pienso'||w==='gastos'?S[w]:P()[w];arr.splice(arr.findIndex(x=>x.id===i),1);guardar();w==='pienso'||w==='gastos'?gastosRe():anteriores(w==='pesos'?'p':'v',cur)}
  if(id==='addN'){const m=val('nm');if(!val('nf')||!m||m==='__new'||!val('np'))return alert('Indica fecha, marca y precio.');const para=gModo.pet!=null?S.pets[gModo.pet].id:($('#nq')&&$('#nq').value!==''?S.pets[+$('#nq').value].id:'');S.pienso.push({id:nid(),f:val('nf'),m,q:'',k:+val('nk')||0,p:+val('np'),para});guardar();gastosRe();aviso('✓ Guardado')}
  if(id==='addG'){const m=val('gc');if(!val('gf')||!m||m==='__new'||!val('gp'))return alert('Indica fecha, concepto e importe.');const para=gModo.pet!=null?S.pets[gModo.pet].id:($('#gq')&&$('#gq').value!==''?S.pets[+$('#gq').value].id:'');S.gastos.push({id:nid(),f:val('gf'),m,p:+val('gp'),para});guardar();gastosRe();aviso('✓ Guardado')}
});
/* ---- ventanas ---- */
const ven=h=>{$('#modal').innerHTML=`<div class="vel"><div class="hoja"><button class="cerrar">Cerrar</button>${h}</div></div>`};
const lis=(a,tipo,fila)=>a.length?`<table>${a.map(x=>`<tr>${fila(x)}<td class="r"><button class="x" data-del="${tipo}:${x.id}" title="Borrar">✕</button></td></tr>`).join('')}</table>`:'<p class="mut">Sin registros.</p>';
async function pedirFoto(){return imgDevDirecto()}
function grafica(pes){const a=[...pes].sort((x,y)=>x.f.localeCompare(y.f));if(a.length<2)return'<p class="mut">Con dos o más pesos aparecerá la gráfica.</p>';
  const v=a.map(x=>+x.kg),mn=Math.min(...v),mx=Math.max(...v),r=(mx-mn)||1,X=i=>50+i*(620/(a.length-1)),Y=k=>150-((k-mn)/r)*120;
  return`<svg viewBox="0 0 700 190" style="width:100%"><line x1="50" y1="155" x2="680" y2="155" stroke="#b98a4a"/><polyline fill="none" stroke="#7a2430" stroke-width="2.5" points="${v.map((k,i)=>X(i)+','+Y(k)).join(' ')}"/>${v.map((k,i)=>`<circle cx="${X(i)}" cy="${Y(k)}" r="4" fill="#c8892b" stroke="#5e1a22"/><text x="${X(i)}" y="${Y(k)-9}" font-size="12" text-anchor="middle" fill="#5e1a22">${k}</text>`).join('')}<text x="50" y="176" font-size="12" fill="#6b3a1c">${fec(a[0].f)}</text><text x="680" y="176" font-size="12" text-anchor="end" fill="#6b3a1c">${fec(a[a.length-1].f)}</text></svg>`}
function anteriores(m,i){const p=S.pets[i]||P();cur=S.pets.indexOf(p);
  ven(`<h2>Datos anteriores</h2><div class="f"><div style="max-width:240px"><label>Mascota</label><select id="aq" onchange="anteriores('${m}',+this.value)">${S.pets.map((q,j)=>`<option value="${j}" ${j===cur?'selected':''}>${esc(q.nombre||'Peludo '+(j+1))}</option>`).join('')}</select></div>
  <div class="sel" style="flex:none"><button data-m="p" class="${m==='p'?'on':''}">Peso</button> <button data-m="v" class="${m==='v'?'on':''}">Visitas veterinarias</button></div></div>
  ${m==='p'?grafica(p.pesos)+lis([...p.pesos].reverse().sort((a,b)=>b.f.localeCompare(a.f)),'pesos',x=>`<td>${fec(x.f)}</td><td>${String(x.kg).replace('.',',')} kg</td><td><i>${esc(x.n||'')}</i></td>`):lis([...p.visitas].reverse().sort((a,b)=>b.f.localeCompare(a.f)),'visitas',x=>`<td>${fec(x.f)}</td><td>${esc(x.m)}<br><i>${esc(x.n)}</i></td><td class="r">${x.c?eur(x.c):''}</td>`)}`)}
let gModo={pet:null},edlTipo='marcas';const gastosRe=()=>gModo.pet!=null?gastosPet(gModo.pet):gastosTotal();
const selLista=(id,tipo)=>`<div class="f" style="gap:6px;align-items:end;flex-wrap:nowrap"><div style="flex:1;min-width:0"><select id="${id}" data-lista="${tipo}"><option value="">— elegir —</option>${ord(S[tipo].map(x=>x.n)).map(n=>`<option>${esc(n)}</option>`).join('')}<option value="__new">+ Nueva…</option></select></div><button class="x2" data-edl="${tipo}" title="Editar la lista">✏</button></div>`;
function totalesMes(){const r={},add=(f,k,t,v)=>{if(!f||!+v)return;((r[f.slice(0,7)]??={})[k]??={ali:0,vet:0,gas:0})[t]+=+v};S.pienso.forEach(x=>add(x.f,x.para||'todos','ali',x.p));S.gastos.forEach(x=>add(x.f,x.para||'todos','gas',x.p));S.pets.forEach(p=>p.visitas.forEach(v=>add(v.f,p.id,'vet',v.c)));return r}
const sumaG=o=>o?o.ali+o.vet+o.gas:0;
const detG=o=>{const a=[];if(o.ali)a.push('Alimentación '+eur(o.ali));if(o.vet)a.push('Veterinario '+eur(o.vet));if(o.gas)a.push('Gastos '+eur(o.gas));return`<small>${a.join(' · ')}</small>`};
const paraTxt=x=>x.para?(S.pets.find(p=>p.id===x.para)?.nombre||'?'):'Todos';
const srtF=a=>[...a].sort((x,y)=>y.f.localeCompare(x.f));
function formsGastos(porPeludo){const sel=id=>`<div><label>Para</label><select id="${id}"><option value="">Todos</option>${optPets(-1)}</select></div>`;
  return`<h3 style="margin-top:0">Alimentación</h3><p class="mut" style="margin:0 0 6px">Pienso, latas, chuches…</p><div class="f"><div><label>Fecha de compra</label><input type="date" id="nf" value="${hoy()}"></div><div style="flex:2"><label>Marca / tipo</label>${selLista('nm','marcas')}</div>${porPeludo?'':sel('nq')}<div style="max-width:90px"><label>Kg</label><input type="number" step="0.1" id="nk"></div><div style="max-width:100px"><label>Precio €</label><input type="number" step="0.01" id="np"></div><button id="addN">Añadir</button></div>`}
function formGas(porPeludo){return`<h3>Gastos</h3><p class="mut" style="margin:0 0 6px">Arena, suplementos, medicinas del veterinario…</p><div class="f"><div><label>Fecha</label><input type="date" id="gf" value="${hoy()}"></div><div style="flex:2"><label>Concepto</label>${selLista('gc','conceptos')}</div>${porPeludo?'':`<div><label>Para</label><select id="gq"><option value="">Todos</option>${optPets(-1)}</select></div>`}<div style="max-width:100px"><label>Importe €</label><input type="number" step="0.01" id="gp"></div><button id="addG">Añadir</button></div>`}
function gastosPet(i){gModo={pet:i};const p=S.pets[i],r=totalesMes(),ks=Object.keys(r).filter(k=>r[k][p.id]).sort().reverse();
  const pi=srtF(S.pienso.filter(x=>x.para===p.id)).slice(0,8),ga=srtF(S.gastos.filter(x=>x.para===p.id)).slice(0,8);
  ven(`<h2>Alimentación y gastos · ${esc((p.nombre||'Peludo').toUpperCase())}</h2>${formsGastos(true)}${lis(pi,'pienso',x=>`<td>${fec(x.f)}</td><td>${esc(x.m)}${x.k?' <i>· '+x.k+' kg</i>':''}</td><td class="r">${eur(x.p)}</td>`)}
  ${formGas(true)}${lis(ga,'gastos',x=>`<td>${fec(x.f)}</td><td>${esc(x.m)}</td><td class="r">${eur(x.p)}</td>`)}
  <h3>Total por mes</h3>${ks.length?`<div class="tw"><table class="tm"><tr><th>Mes</th><th class="r">Aliment.</th><th class="r">Vet.</th><th class="r">Gastos</th><th class="r">Total</th></tr>${ks.map(k=>{const o=r[k][p.id];return`<tr><td>${mesK(k)}</td><td class="r">${eur(o.ali)}</td><td class="r">${eur(o.vet)}</td><td class="r">${eur(o.gas)}</td><td class="r"><b>${eur(sumaG(o))}</b></td></tr>`}).join('')}</table></div><p class="mut">Los gastos comunes («Todos») están en «Gastos totales».</p>`:'<p class="mut">Cuando anotes gastos y visitas con coste, verás aquí el total de cada mes.</p>'}`)}
function gastosTotal(){gModo={pet:null};const r=totalesMes(),ks=Object.keys(r).sort().reverse(),pets=[...S.pets].sort((a,b)=>String(a.nombre||'').localeCompare(String(b.nombre||''),'es',{sensitivity:'base'}));
  const pi=srtF(S.pienso).slice(0,6),ga=srtF(S.gastos).slice(0,6);
  const tabla=ks.length?`<div class="tw"><table class="tm">${ks.map(k=>{const o=r[k],tot=Object.values(o).reduce((a,x)=>a+sumaG(x),0);return`<tr class="mh"><td>${mesK(k)}</td><td class="r">${eur(tot)}</td></tr>`+(o.todos?`<tr class="ms"><td>Todos (común)<br>${detG(o.todos)}</td><td class="r">${eur(sumaG(o.todos))}</td></tr>`:'')+pets.filter(p=>o[p.id]).map(p=>`<tr class="ms"><td>${esc(p.nombre)}<br>${detG(o[p.id])}</td><td class="r">${eur(sumaG(o[p.id]))}</td></tr>`).join('')}).join('')}</table></div>`:'<p class="mut">Cuando anotes gastos verás aquí el total de cada mes, desglosado por peludo y común.</p>';
  ven(`<h2>Gastos totales</h2>${formsGastos(false)}${lis(pi,'pienso',x=>`<td>${fec(x.f)}</td><td>${esc(x.m)} <i>· ${esc(paraTxt(x))}${x.k?' · '+x.k+' kg':''}</i></td><td class="r">${eur(x.p)}</td>`)}
  ${formGas(false)}${lis(ga,'gastos',x=>`<td>${fec(x.f)}</td><td>${esc(x.m)} <i>· ${esc(paraTxt(x))}</i></td><td class="r">${eur(x.p)}</td>`)}
  <h3>Total por mes</h3>${tabla}`)}
function editarLista(tipo){edlTipo=tipo;ven(`<h2>Editar ${tipo==='marcas'?'marcas de alimentación':'conceptos de gastos'}</h2><p class="mut">✏ corrige el nombre (también en lo ya apuntado) · ✕ lo quita de la lista (lo ya apuntado se conserva)</p><div id="edl"></div><div class="f" style="margin-top:10px;justify-content:space-between"><button id="edlNew">+ Añadir</button><button id="edlBack">Volver</button></div>`);pintaEdl()}
function pintaEdl(){const a=[...S[edlTipo]].sort((x,y)=>x.n.localeCompare(y.n,'es',{sensitivity:'base'}));$('#edl').innerHTML=a.length?`<table>${a.map(x=>`<tr><td>${esc(x.n)}</td><td class="r"><button class="x2" data-edlr="${x.id}" title="Corregir">✏</button> <button class="x" data-edld="${x.id}" title="Quitar">✕</button></td></tr>`).join('')}</table>`:'<p class="mut">La lista está vacía.</p>'}
async function salir(){if(!confirm('¿Salir de La Huella?\n\nSe guardarán los cambios y se sincronizará con Dropbox (si está conectado).'))return;guardar();await escribirCarpeta();let ok='guardados en este dispositivo';
  if(Sync.status().connected){ven('<h2>Guardando…</h2><p>Sincronizando con Dropbox…</p>');try{await Sync.syncNow({});ok='guardados y sincronizados con Dropbox'}catch{ok='guardados en este dispositivo (ahora no se pudo sincronizar)'}}
  ven(`<h2>¡Hasta pronto!</h2><p>Tus datos están ${ok}.<br>Ya puedes cerrar esta ventana.</p>`);try{window.close()}catch{}}
const hora=ts=>ts?new Date(ts).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
async function escribirCarpeta(){if(!dirs.DATOS)return;try{const w=await(await dirs.DATOS.getFileHandle('datos.json',{create:true})).createWritable();await w.write(JSON.stringify(S,null,1));await w.close()}catch{}}
const host={instance:'huella',device:DISP,get:()=>S,stamp:()=>Sync.stamp(S),
  async replace(d){S=d;migrar();Sync.ensureStamps(S);Sync.reset(S);await iset('datos',JSON.stringify(S));await escribirCarpeta();render()},
  async backup(label){const tx=JSON.stringify(S,null,1);if(dirs.BACKUP){const f=await dirs.BACKUP.getFileHandle('BK_'+label+'_'+hoy()+'_'+DISP+'.json',{create:true});const w=await f.createWritable();await w.write(tx);await w.close()}else await iset('bk:'+label,{t:Date.now(),tx})}};
async function pintarSync(){const b=$('#syncBody');if(!b)return;const st=Sync.status();
  if(!st.connected){const draft=$('#syncCode')?.value||'';let u='';try{u=await Sync.authUrl()}catch{}
    b.innerHTML=`<p>Conecta tu Dropbox para tener a Bibi, Tris y todos los peludos al día en Windows, Android y iPad. La app solo usa su propia carpeta dentro de <b>Apps</b> de tu Dropbox.</p><ol><li>Pulsa <b>Abrir Dropbox</b>, inicia sesión y pulsa <b>Permitir</b>.</li><li>Copia el <b>código</b> que te muestra Dropbox.</li><li>Pégalo aquí y pulsa <b>Conectar</b>.</li></ol>${u?`<p><a class="btnlink" href="${u}" target="_blank" rel="noopener">Abrir Dropbox…</a></p>`:'<p class="err">No se pudo preparar la conexión en este navegador.</p>'}<label>Código de Dropbox</label><input id="syncCode" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Pega aquí el código" value="${esc(draft)}"><div class="f" style="margin-top:12px"><button id="syncConnect">Conectar</button></div>${st.error?`<p class="err">${esc(st.error)}</p>`:''}`}
  else b.innerHTML=`<p class="ok">● Conectado a Dropbox</p><p>Última sincronización: <b>${hora(st.lastSyncAt)}</b>${st.busy?' (sincronizando…)':''}</p>${st.lastResult?`<p class="mut">${esc(st.lastResult)}</p>`:''}${st.error?`<p class="err">${esc(st.error)}</p>`:''}${st.pending&&!st.error?'<p>Hay cambios pendientes: se enviarán cuando haya conexión.</p>':''}<p class="mut">Se sincroniza sola al abrir la app, unos segundos después de cada cambio y al recuperar la conexión. Las copias automáticas (máx. 1 al día) van a la carpeta BACKUP de la app en tu Dropbox.</p><div class="f" style="margin-top:12px;justify-content:space-between"><button id="syncDisc">Desconectar este dispositivo</button><button id="syncNow">Sincronizar ahora</button></div>`}
Sync.onStatus(st=>{pintarDestino();const e=!st.connected?'':st.busy?'Sincronizando…':st.error&&!st.pending?'Error al sincronizar':st.pending?'Pendiente':'Sincronizado '+hora(st.lastSyncAt);$('#syncEst').textContent=e;if($('#syncBody')&&document.activeElement?.id!=='syncCode')pintarSync()});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('Service worker no registrado',e)));
iniciar();
</script></body></html>
